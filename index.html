<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Practice · Lucía</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1d2638;--muted:#6b7280;--border:#dde4ef;--blue:#2856d9;--blue2:#173eae;--ok:#197044;--okbg:#eefaf3;--bad:#a92e2e;--badbg:#fff1f1}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#edf3ff,#f6f8fb 300px);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:28px 16px 50px} h1{text-align:center;margin:0;font-size:clamp(2rem,6vw,3rem)} .intro{text-align:center;color:var(--muted);max-width:650px;margin:8px auto 24px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px} .test{border:2px solid var(--border);background:#fff;border-radius:18px;padding:21px;text-align:left;cursor:pointer;box-shadow:0 8px 26px #1420440c}
.test:hover{border-color:#9fb5ff;transform:translateY(-2px)} .test h2{font-size:1.15rem;margin:0 0 8px} .test p{color:var(--muted);line-height:1.45;margin:0 0 15px} .go{display:inline-block;background:var(--blue);color:#fff;border-radius:10px;padding:10px 14px;font-weight:750}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 10px 32px #14204412} .hidden{display:none!important}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start} .title{font-weight:850;font-size:1.15rem} .desc{color:var(--muted);font-size:.9rem;margin-top:3px} .back{border:0;border-radius:10px;padding:9px 12px;background:#edf1f7;font-weight:700;cursor:pointer}
.bar{height:10px;background:#e7ebf2;border-radius:99px;overflow:hidden;margin:18px 0 7px} .fill{height:100%;width:0;background:var(--blue);transition:.2s}
.info{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:19px} .num{font-size:.9rem;color:var(--blue);font-weight:800;margin-bottom:7px}
.q{font-size:clamp(1.25rem,3vw,1.55rem);font-weight:800;line-height:1.42;margin-bottom:20px} .opts{display:grid;gap:12px}
.opt{border:2px solid var(--border);background:#fff;border-radius:14px;padding:15px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit} .opt:hover:not(:disabled){border-color:#9fb5ff} .opt.sel{border-color:var(--blue);background:#eef4ff} .opt.good{border-color:#78bd97;background:var(--okbg)} .opt.bad{border-color:#e19b9b;background:var(--badbg)}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:14px;line-height:1.5} .feedback.good{display:block;background:var(--okbg);border:1px solid #bae1c9;color:#145c39} .feedback.bad{display:block;background:var(--badbg);border:1px solid #efc3c3;color:#812828}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px} .btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer} .primary{background:var(--blue);color:#fff} .dark{background:#192235;color:#fff} .btn:disabled{opacity:.45}
.result{text-align:center} .score{font-size:4rem;font-weight:900;margin:10px 0 0} .muted{color:var(--muted)} .result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.review{text-align:left;margin-top:25px;border-top:1px solid var(--border);padding-top:18px} .review-item{padding:10px 0;border-bottom:1px solid #edf0f5} footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:18px}
@media(max-width:620px){.grid{grid-template-columns:1fr} .card{padding:18px} .actions .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>English Practice</h1>
  <p class="intro">Elige uno de los dos tests. Si fallas una pregunta verás la respuesta correcta y una explicación. Al terminar puedes repetir solo los errores.</p>

  <section id="home" class="grid">
    <button class="test" data-key="t1"><h2>Test 1 · Ejercicio original</h2><p>Las 30 preguntas del ejercicio en el que se basa el examen.</p><span class="go">Empezar</span></button>
    <button class="test" data-key="t2"><h2>Test 2 · Repaso adicional</h2><p>30 preguntas nuevas para practicar los mismos tiempos verbales.</p><span class="go">Empezar</span></button>
  </section>

  <section id="quizSection" class="hidden">
    <div class="card">
      <div class="top">
        <div><div id="title" class="title"></div><div id="desc" class="desc"></div></div>
        <button id="back" class="back">← Tests</button>
      </div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="info"><span id="count"></span><span id="live"></span></div>

      <div id="quiz">
        <div id="num" class="num"></div>
        <div id="question" class="q"></div>
        <div id="opts" class="opts"></div>
        <div id="feedback" class="feedback"></div>
        <div class="actions"><button id="check" class="btn primary" disabled>Comprobar</button><button id="next" class="btn dark hidden">Siguiente</button></div>
      </div>

      <div id="result" class="result hidden">
        <h2>Resultado</h2><div id="score" class="score"></div><div id="percent" class="muted"></div><p id="message" class="muted"></p>
        <div class="result-actions"><button id="retry" class="btn primary">Repetir errores</button><button id="restart" class="btn dark">Repetir test</button><button id="choose" class="btn">Elegir otro test</button></div>
        <div id="review" class="review hidden"><h3>Preguntas a repasar</h3><div id="reviewList"></div></div>
      </div>
    </div>
  </section>
  <footer>Página autocontenida · sin dependencias externas · lista para GitHub Pages</footer>
</div>

<script>
const tests={"t1": {"title": "Test 1 · Ejercicio original", "desc": "Las 30 preguntas del ejercicio en el que se basa el examen.", "questions": [["She ... drinks coffee in the morning.", ["at the moment", "always"], 1, "«Always» indica hábito. Para hábitos usamos Present Simple."], ["... your homework in the afternoon?", ["Do you do", "Are you doing"], 0, "Aquí hablamos de una rutina. Para hábitos usamos Present Simple."], ["I ... my grandparents in Italy every summer.", ["visit", "am visiting"], 0, "«Every summer» indica una acción habitual: Present Simple."], ["I am outside now. It ... heavily.", ["rains", "is raining"], 1, "«Now» indica que sucede en este momento: Present Continuous."], ["I'm trying to concentrate ... .", ["at the moment", "all the time"], 0, "«At the moment» encaja con una acción que sucede ahora."], ["Look! People ... out of the building.", ["run", "are running"], 1, "«Look!» indica que la acción sucede ahora: Present Continuous."], ["The shop opens ... .", ["at half past 9", "soon"], 0, "Los horarios fijos suelen expresarse con Present Simple."], ["Let's meet. I ... this afternoon.", ["don't work", "am not working"], 1, "Es una situación concreta de esta tarde: Present Continuous."], ["I ... with friends tonight.", ["won't go out", "am not going out"], 1, "«Tonight» expresa aquí un plan concreto: Present Continuous."], ["What are you wearing to the party ... ?", ["tonight", "every week"], 0, "«Tonight» encaja con un plan concreto; «every week» indicaría rutina."], ["The train ... tomorrow at 7 in the morning.", ["leaves", "is going to leave"], 0, "Los horarios oficiales de trenes, vuelos, etc. usan Present Simple."], ["What ... in the shopping centre yesterday?", ["did you buy", "were you buying"], 0, "«Yesterday» y una acción terminada: Past Simple."], ["... for school on time?", ["Was she leaving", "Did she leave"], 1, "Se pregunta si la acción se completó: Past Simple."], ["What did she do ... she saw the bear?", ["when", "while"], 0, "Una acción breve en Past Simple se introduce aquí con «when»."], ["Where ... when I saw you last night?", ["do you go", "were you going"], 1, "Una acción estaba en progreso cuando ocurrió otra: Past Continuous."], ["What ... when he asked her to marry him?", ["did she say", "was she saying"], 0, "Se pregunta qué dijo en un momento concreto: Past Simple."], ["I ... to the radio while I was driving to work.", ["was listening", "listened"], 0, "Dos acciones en progreso al mismo tiempo: Past Continuous."], ["Be careful! The plates ... fall.", ["will", "are going to"], 1, "Hay evidencia de que va a ocurrir: «be going to»."], ["Do you think she ... agree?", ["will", "is going to"], 0, "Con «Do you think...?» expresamos opinión o predicción: normalmente «will»."], ["Take an umbrella. It's going to rain ... .", ["later", "next year"], 0, "La predicción es cercana; «later» encaja con el contexto."], ["Don't worry. I ... say anything.", ["won't", "am not going to"], 0, "Es una promesa o decisión en el momento: «won't»."], ["What ... wear to the wedding?", ["will you", "are you going to"], 1, "Se pregunta por un plan o intención previa: «be going to»."], ["I can't hear you. You ... too softly.", ["are speaking", "speak"], 0, "Está pasando ahora mismo: Present Continuous."], ["He never ... anyone for help.", ["is asking", "asks"], 1, "«Never» expresa hábito o frecuencia: Present Simple."], ["My friends arrived while I ... .", ["slept", "was sleeping"], 1, "Una acción estaba en progreso cuando ocurrió otra: Past Continuous."], ["This time last year, we ... in Peru.", ["were travelling", "travelled"], 0, "Acción en progreso en un momento concreto del pasado: Past Continuous."], ["What ... about my idea?", ["are you thinking", "do you think"], 1, "Para pedir una opinión usamos «What do you think...?»."], ["Why didn't you say anything ... ?", ["last week", "next week"], 0, "«Didn't say» está en pasado, por eso encaja «last week»."], ["What ... every day?", ["do you do", "are you doing"], 0, "«Every day» indica rutina: Present Simple."], ["Someone's outside. I ... the door.", ["am opening", "will open"], 1, "Decisión tomada en el momento: «will»."]]}, "t2": {"title": "Test 2 · Repaso adicional", "desc": "30 preguntas nuevas para practicar los mismos temas.", "questions": [["My brother ... football every Saturday.", ["plays", "is playing"], 0, "«Every Saturday» indica rutina: Present Simple."], ["Listen! Someone ... at the door.", ["knocks", "is knocking"], 1, "«Listen!» indica que ocurre ahora: Present Continuous."], ["We usually ... dinner at 8 o'clock.", ["have", "are having"], 0, "«Usually» expresa una costumbre: Present Simple."], ["I can't talk now. I ... my homework.", ["do", "am doing"], 1, "«Now» indica acción en curso: Present Continuous."], ["She ... to school by bus every day.", ["goes", "is going"], 0, "«Every day» indica rutina: Present Simple."], ["Look! The children ... in the garden.", ["play", "are playing"], 1, "«Look!» indica acción actual: Present Continuous."], ["My father ... coffee in the evening.", ["never drinks", "is never drinking"], 0, "«Never» expresa frecuencia: Present Simple."], ["What ... at the moment?", ["do you do", "are you doing"], 1, "«At the moment» es una pista de Present Continuous."], ["We ... our grandparents this weekend.", ["are visiting", "visit every weekend"], 0, "Plan concreto para este fin de semana: Present Continuous."], ["The film ... at 9:30 tonight.", ["starts", "is going to start"], 0, "Los horarios programados suelen usar Present Simple."], ["I ... my keys yesterday.", ["lost", "was losing"], 0, "«Yesterday» y acción terminada: Past Simple."], ["What ... last Saturday?", ["did you do", "were you doing"], 0, "Pregunta por una acción terminada: Past Simple."], ["She ... home when it started to rain.", ["walked", "was walking"], 1, "Acción en progreso interrumpida por otra: Past Continuous."], ["While I ... dinner, the phone rang.", ["cooked", "was cooking"], 1, "«While» introduce aquí una acción en progreso: Past Continuous."], ["They ... TV when I arrived.", ["watched", "were watching"], 1, "La acción estaba en curso cuando llegué: Past Continuous."], ["What did you do when you ... the accident?", ["saw", "were seeing"], 0, "«Saw» es un hecho puntual: Past Simple."], ["I ... to music while my sister was studying.", ["was listening", "listened"], 0, "Dos acciones simultáneas en progreso: Past Continuous."], ["When the teacher came in, the students ... .", ["were talking", "talked"], 0, "Ya estaban hablando cuando entró: Past Continuous."], ["This time yesterday, we ... on the beach.", ["were sitting", "sat"], 0, "Acción en progreso en un momento concreto del pasado: Past Continuous."], ["She ... her phone while she was running.", ["dropped", "was dropping"], 0, "«Dropped» es el hecho breve dentro de una acción en progreso: Past Simple."], ["Look at those clouds! It ... rain.", ["will", "is going to"], 1, "Hay evidencia visible: «be going to»."], ["I think Barcelona ... win the match.", ["will", "is going to"], 0, "Con «I think» expresamos una opinión o predicción: «will»."], ["I'm thirsty. I ... get some water.", ["will", "am going to"], 0, "Decisión espontánea en el momento: «will»."], ["We have already bought the tickets. We ... travel to Madrid next week.", ["are going to", "will"], 0, "Ya existe un plan previo: «be going to»."], ["Don't worry. I ... help you with your homework.", ["will", "am helping"], 0, "Promesa u ofrecimiento: «will»."], ["What ... do after school today?", ["are you going to", "will you usually"], 0, "Pregunta por un plan para hoy: «be going to»."], ["Be careful! You ... drop that glass.", ["are going to", "will"], 0, "Hay evidencia inmediata: «be going to»."], ["I don't think she ... be late.", ["will", "is going to"], 0, "Opinión o predicción con «I don't think»: «will»."], ["Someone is calling me. I ... answer the phone.", ["will", "am going to"], 0, "Decisión tomada en ese instante: «will»."], ["They have decided everything. They ... move to London next year.", ["are going to", "will"], 0, "Decisión ya tomada: «be going to»."]]}};
let key=null, qs=[], pos=0, selected=null, checked=false, correct=0, wrong=[];
const $=id=>document.getElementById(id);

function home(){ $("home").classList.remove("hidden"); $("quizSection").classList.add("hidden"); window.scrollTo(0,0); }
function start(k,set=null){
  key=k; qs=set?[...set]:[...tests[k].questions]; pos=0; selected=null; checked=false; correct=0; wrong=[];
  $("home").classList.add("hidden"); $("quizSection").classList.remove("hidden"); $("quiz").classList.remove("hidden"); $("result").classList.add("hidden");
  $("title").textContent=tests[k].title+(set?" · Repaso de errores":""); $("desc").textContent=set?"Solo las preguntas falladas en la vuelta anterior.":tests[k].desc;
  render(); window.scrollTo(0,0);
}
function render(){
  selected=null; checked=false; $("check").disabled=true; $("check").classList.remove("hidden"); $("next").classList.add("hidden"); $("feedback").className="feedback"; $("feedback").innerHTML="";
  const x=qs[pos]; $("num").textContent=`Pregunta ${pos+1}`; $("question").textContent=x[0]; $("count").textContent=`${pos+1} / ${qs.length}`; $("live").textContent=`Aciertos: ${correct}`; $("fill").style.width=`${pos/qs.length*100}%`; $("opts").innerHTML="";
  x[1].forEach((o,i)=>{ let b=document.createElement("button"); b.className="opt"; b.innerHTML=`<b>${String.fromCharCode(97+i)})</b> ${o}`; b.onclick=()=>{if(checked)return; selected=i; [...$("opts").children].forEach(e=>e.classList.remove("sel")); b.classList.add("sel"); $("check").disabled=false;}; $("opts").appendChild(b); });
}
$("check").onclick=()=>{
  if(selected===null||checked)return; checked=true; const x=qs[pos], bs=[...$("opts").children]; bs.forEach(b=>b.disabled=true);
  if(selected===x[2]){correct++; bs[selected].classList.add("good"); $("feedback").className="feedback good"; $("feedback").innerHTML=`<b>✓ Correcto</b><br>${x[3]}`;}
  else{bs[selected].classList.add("bad"); bs[x[2]].classList.add("good"); wrong.push(x); $("feedback").className="feedback bad"; $("feedback").innerHTML=`<b>✗ No es correcto</b><br>La respuesta correcta es <b>${String.fromCharCode(97+x[2])}) ${x[1][x[2]]}</b>.<br><br>${x[3]}`;}
  $("live").textContent=`Aciertos: ${correct}`; $("check").classList.add("hidden"); $("next").classList.remove("hidden"); $("next").textContent=pos===qs.length-1?"Ver resultado":"Siguiente";
};
$("next").onclick=()=>{ if(pos<qs.length-1){pos++;render();} else finish(); };
function finish(){
  $("fill").style.width="100%"; $("count").textContent=`${qs.length} / ${qs.length}`; $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const p=Math.round(correct/qs.length*100); $("score").textContent=`${correct} / ${qs.length}`; $("percent").textContent=`${p}% de aciertos`;
  $("message").textContent=p===100?"Perfecto. Has acertado todas las preguntas.":p>=80?"Muy buen resultado. Repasa solo los errores.":p>=60?"Vas bien, pero conviene repetir los errores.":"Conviene dar otra vuelta y fijarse en las palabras pista.";
  $("retry").style.display=wrong.length?"inline-block":"none"; $("review").classList.toggle("hidden",!wrong.length); $("reviewList").innerHTML="";
  wrong.forEach((x,i)=>{let d=document.createElement("div");d.className="review-item";d.innerHTML=`<b>${i+1}. ${x[0]}</b><br>Respuesta: ${x[1][x[2]]}`;$("reviewList").appendChild(d);});
}
document.querySelectorAll(".test").forEach(b=>b.onclick=()=>start(b.dataset.key));
$("back").onclick=home; $("choose").onclick=home; $("restart").onclick=()=>start(key); $("retry").onclick=()=>{const e=[...wrong];start(key,e);};
</script>
</body>
</html>
